[workspace]
members = [
    "apps/unbg-cli",
    "crates/unbg-core",
    "crates/unbg-model-registry",
    "crates/unbg-installer",
    "crates/unbg-runtime-ort",
    "crates/unbg-image",
    "crates/unbg-bench",
    "crates/unbg-telemetry",
    "crates/unbg-uniffi",
    "integrations/tauri-plugin-unbg",
    "integrations/android-unbg",
    "integrations/ios-unbg",
    "apps/smoke-tests",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
sha2 = "0.11.0"
hex = "0.4.3"
tempfile = "3.27.0"
walkdir = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
ndarray = "0.17.2"
uniffi = "0.32.0"
