name: cli-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-cli-assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            arch: x86_64
            source_bin_name: unbg-cli
            output_bin_name: unbg
            ort_archive_url: https://github.com/microsoft/onnxruntime/releases/download/v1.27.1/onnxruntime-linux-x64-1.27.1.tgz
            ort_archive_sha256: 25b1ef1fea1acd210d63f8f24dc870ad6e077795ce1f54876252c6d3803c15af
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            arch: x86_64
            source_bin_name: unbg-cli.exe
            output_bin_name: unbg.exe
            ort_archive_url: https://github.com/microsoft/onnxruntime/releases/download/v1.27.1/onnxruntime-win-x64-1.27.1.zip
            ort_archive_sha256: 2e00414a63fdef0914cd5a5ede6c707844878e0c08e1b6693842f0451b2df2a1
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset_os: macos
            arch: x86_64
            source_bin_name: unbg-cli
            output_bin_name: unbg
            # ONNX Runtime 1.23.2 is the final upstream macOS x86_64 archive.
            ort_archive_url: https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-osx-x86_64-1.23.2.tgz
            ort_archive_sha256: d10359e16347b57d9959f7e80a225a5b4a66ed7d7e007274a15cae86836485a6
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset_os: macos
            arch: aarch64
            source_bin_name: unbg-cli
            output_bin_name: unbg
            ort_archive_url: https://github.com/microsoft/onnxruntime/releases/download/v1.27.1/onnxruntime-osx-arm64-1.27.1.tgz
            ort_archive_sha256: e42b77a7281cc6e55141bf44fcfbac2c782b823a491bbb6ac33c781dd991f8a6
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build CLI
        run: cargo build -p unbg-cli --release --target ${{ matrix.target }} --locked
      - name: Package archive
        shell: pwsh
        run: |
          $assetName = "unbg-${{ matrix.asset_os }}-${{ matrix.arch }}"
          $stageDir = Join-Path $PWD "dist/$assetName"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          $releaseDir = Join-Path $PWD "target/${{ matrix.target }}/release"
          $depsDir = Join-Path $releaseDir "deps"
          $binSource = Join-Path $releaseDir "${{ matrix.source_bin_name }}"
          Copy-Item -Path $binSource -Destination (Join-Path $stageDir "${{ matrix.output_bin_name }}") -Force
          Copy-Item -Path "LICENSE", "MODEL_LICENSES.md" -Destination $stageDir -Force
          $runtimePatterns = @("onnxruntime*.dll", "libonnxruntime*.so*", "libonnxruntime*.dylib")
          $searchRoots = @($releaseDir, $depsDir)
          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) { continue }
            foreach ($pattern in $runtimePatterns) {
              Get-ChildItem -Path $root -Filter $pattern -File -ErrorAction SilentlyContinue | ForEach-Object {
                Copy-Item -Path $_.FullName -Destination (Join-Path $stageDir $_.Name) -Force
              }
            }
          }
          $ortArchive = Join-Path $PWD "dist/onnxruntime-archive"
          $ortExtract = Join-Path $PWD "dist/onnxruntime-extract"
          Write-Host "Downloading ONNX Runtime archive: ${{ matrix.ort_archive_url }}"
          Invoke-WebRequest -Uri "${{ matrix.ort_archive_url }}" -OutFile $ortArchive
          $actualSha256 = (Get-FileHash -Path $ortArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne "${{ matrix.ort_archive_sha256 }}") {
            throw "ONNX Runtime archive checksum mismatch: expected ${{ matrix.ort_archive_sha256 }}, got $actualSha256"
          }
          New-Item -ItemType Directory -Path $ortExtract -Force | Out-Null
          if ("${{ matrix.ort_archive_url }}" -like "*.zip") {
            Expand-Archive -Path $ortArchive -DestinationPath $ortExtract -Force
          } else {
            tar -xzf $ortArchive -C $ortExtract
          }
          Get-ChildItem -Path $ortExtract -Recurse -File | Where-Object {
            $_.Name -like "onnxruntime*.dll" -or $_.Name -like "libonnxruntime*.so*" -or $_.Name -like "libonnxruntime*.dylib"
          } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination (Join-Path $stageDir $_.Name) -Force
          }
          $assetPath = "dist/$assetName.zip"
          Compress-Archive -Path "$stageDir/*" -DestinationPath $assetPath -Force
          $assetHash = (Get-FileHash -Path $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$assetHash  $assetName.zip`n" | Set-Content -Path "$assetPath.sha256" -Encoding ascii -NoNewline
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unbg-cli-${{ matrix.asset_os }}-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256

  publish-cli-assets:
    needs: build-cli-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Attach assets to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
